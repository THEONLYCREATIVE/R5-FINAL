<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0A0F5A">
<title>PharmaScan Pro | Deep Blue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Syne:wght@700&family=Mulish:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ─── BOOTS DEEP BLUE THEME VARIABLES ─── */
:root {
  /* Backgrounds */
  --b0: #0A0F5A; /* Boots deep blue */
  --card-glass: rgba(255, 255, 255, 0.07); /* glass on blue */
  --nav-glass: rgba(10, 15, 90, 0.88); /* dark blue blur */
  --modal: #0C1A78; /* dark blue sheet */
  --toast: #1C2A36; /* navy pill */
  
  /* Borders & Shadows */
  --border: rgba(255, 255, 255, 0.1); /* faint white */
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.25); /* deep dark */
  
  /* Typography */
  --text: #F2F2F2; /* soft white */
  --text-dim: #C8D0E8; /* light blue-white */
  --text-muted: #8892B8; /* blue-grey */
  
  /* Brand Accents */
  --accent: #4FC3F7; /* light blue pops on dark */
  --accent-glow: rgba(79, 195, 247, 0.15);
  
  /* Expiry Status Colors */
  --success: #05d12b; /* Green */
  --fair: #72d06c;    /* Light Green */
  --warning: #db551b; /* Orange */
  --danger: #E72107;  /* Red */

  /* Structure */
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --font-mono: 'IBM Plex Mono', monospace;
  --font-display: 'Syne', sans-serif;
  --font-body: 'Mulish', sans-serif;
}

/* ─── RESET & BASE ─── */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { 
  font-family: var(--font-body); 
  background: var(--b0); 
  color: var(--text); 
  height: 100dvh; 
  overflow: hidden; 
  line-height: 1.5;
}

/* ─── LAYOUT ─── */
.app { display: flex; flex-direction: column; height: 100dvh; }

/* ─── TOP BAR (NAV GLASS) ─── */
.topbar {
  flex-shrink: 0;
  padding: calc(env(safe-area-inset-top, 0px) + 15px) 20px 15px;
  background: var(--nav-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  z-index: 10;
}
.logo-pill {
  background: var(--accent);
  color: var(--b0);
  padding: 4px 10px; border-radius: var(--radius-sm);
  font-family: var(--font-display); font-weight: 700; font-size: 14px;
}
.logo-text { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin-left: 8px; color: var(--text); }
.logo-ver { font-family: var(--font-mono); font-size: 10px; color: var(--accent); background: var(--card-glass); padding: 2px 6px; border-radius: 4px; margin-left: 6px; font-weight: 600; }

/* ─── PAGES ─── */
.pages { flex: 1; position: relative; overflow: hidden; }
.page { 
  position: absolute; inset: 0; overflow-y: auto; 
  padding: 16px 16px calc(100px + env(safe-area-inset-bottom, 0px)); 
  display: none; 
}
.page.active { display: block; animation: fadeIn 0.3s ease; }

/* ─── CARDS & UI (GLASS ON BLUE) ─── */
.scan-card, .stat-card, .hist-card {
  background: var(--card-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
  box-shadow: var(--shadow);
}

/* Inputs */
.barcode-row { display: flex; gap: 8px; margin-bottom: 12px; }
input.glass-input {
  flex: 1; height: 50px; background: rgba(0, 0, 0, 0.2); 
  border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text); padding: 0 16px; font-family: var(--font-mono);
}
input.glass-input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 12px var(--accent-glow); }
input.glass-input::placeholder { color: var(--text-muted); }

/* Buttons */
.btn {
  height: 48px; border-radius: var(--radius); border: none;
  font-weight: 700; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-primary { background: var(--accent); color: var(--b0); }
.btn-glass { background: var(--card-glass); border: 1px solid var(--border); color: var(--text-dim); }
.btn:active { transform: scale(0.96); }

/* Stats */
.stats-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.stat-card { text-align: center; padding: 12px 8px; }
.stat-val { font-family: var(--font-mono); font-size: 24px; font-weight: 700; color: var(--accent); }
.stat-lbl { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

/* Section Headers */
.sec-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sec-title { font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
.sec-action { font-size: 12px; font-weight: 700; color: var(--accent); cursor: pointer; }

/* Chips */
.chips-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; }
.chip { 
  white-space: nowrap; padding: 6px 14px; border-radius: 20px; 
  background: var(--card-glass); border: 1px solid var(--border); color: var(--text-dim); 
  font-size: 12px; font-weight: 600; 
}
.chip.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }

/* ─── HISTORY WIDGET (WITH EXPIRY COLORS) ─── */
.hist-card { display: flex; padding: 0; overflow: hidden; align-items: stretch; }
.card-accent { width: 6px; flex-shrink: 0; }
.card-accent.good { background: var(--success); }
.card-accent.fair { background: var(--fair); }
.card-accent.warn { background: var(--warning); }
.card-accent.expired { background: var(--danger); }
.card-body { padding: 12px 16px; flex: 1; }

.card-name { font-weight: 800; font-size: 14px; margin-bottom: 4px; color: var(--text); text-transform: uppercase; }

/* Metadata & Bigger Expiry layout */
.card-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
.card-meta span { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
.card-meta .meta-exp { font-size: 13px; font-weight: 800; color: var(--text); }

/* Meta Text Color Overrides based on status */
.meta-exp.warn-text { color: var(--warning); }
.meta-exp.expired-text { color: var(--danger); }
.meta-exp.good-text { color: var(--success); }

/* Pills & Badges */
.qty-badge { background: rgba(79, 195, 247, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 6px; font-size: 12px; font-family: var(--font-mono); font-weight: 700; }
.status-pill { background: var(--card-glass); border: 1px solid var(--border); color: var(--text-dim); padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }

/* ─── DOCK (NAV GLASS) ─── */
.dock-wrap {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 15px);
  background: linear-gradient(0deg, var(--b0) 40%, transparent 100%);
  display: flex; justify-content: center; z-index: 100; pointer-events: none;
}
.dock {
  background: var(--nav-glass); 
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  padding: 8px; border-radius: 28px; display: flex; gap: 8px;
  box-shadow: var(--shadow); pointer-events: auto;
}
.dock-btn {
  width: 50px; height: 50px; border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); cursor: pointer; transition: all 0.2s;
  font-size: 20px;
}
.dock-btn.active { background: var(--card-glass); color: var(--accent); border: 1px solid var(--border); }

/* Animations */
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="topbar-logo">
      <span class="logo-pill">PS</span>
      <span class="logo-text">PharmaScan<span class="logo-ver">v5.0</span></span>
    </div>
    <div class="topbar-right" style="display: flex; align-items: center; gap: 12px;">
      <span style="font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--accent); background: var(--card-glass); border: 1px solid var(--border); padding: 4px 8px; border-radius: 6px;">STR-802</span>
      <div style="font-size: 20px; cursor: pointer; color: var(--text-dim);">⚙️</div>
    </div>
  </header>

  <main class="pages">
    <section id="scan-page" class="page active">
      <div class="scan-card">
        <div class="sec-hdr">
          <span class="sec-title">Quick Scanner</span>
        </div>
        <div class="barcode-row">
          <input type="text" class="glass-input" placeholder="Scan or enter code..." autofocus>
          <button class="btn btn-glass" style="width: 50px; padding: 0;">📷</button>
        </div>
        <div class="scan-btns">
          <button class="btn btn-glass" style="flex: 1;">Manual Entry</button>
          <button class="btn btn-primary" style="flex: 1;">Process Item</button>
        </div>
      </div>

      <div class="stats-strip">
        <div class="stat-card">
          <div class="stat-val">128</div>
          <div class="stat-lbl">Today</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" style="color: var(--warning);">14</div>
          <div class="stat-lbl">Expiring</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" style="color: var(--text-dim);">52</div>
          <div class="stat-lbl">Pending</div>
        </div>
      </div>

      <div class="sec-hdr">
        <span class="sec-title">Recent Activity</span>
        <span class="sec-action">View All</span>
      </div>

      <div class="chips-row">
        <div class="chip active">All Items</div>
        <div class="chip">Medicines</div>
        <div class="chip">Skincare</div>
        <div class="chip">Supplements</div>
      </div>

      <div class="hist-card">
        <div class="card-accent warn"></div>
        
        <div class="card-body">
          <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px;">
            <div class="card-name" style="color: var(--warning);">ZELLER REDORMIN FORTE 30S</div>
            <span class="qty-badge">×3</span>
          </div>
          
          <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 10px; display: flex; align-items: center; gap: 4px;">
            🏢 Zeller AG
          </div>

          <div class="card-meta">
            <span class="meta-barcode">07640144122751</span>
            <span class="meta-exp warn-text">Exp: May 2026</span>
            <span class="meta-batch">231001</span>
          </div>
          
          <div class="card-footer" style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px;">
            <span class="status-pill">Pending</span>
            <button style="background: var(--card-glass); border: 1px solid var(--border); border-radius: 16px; padding: 6px 14px; font-size: 12px; font-weight: 700; color: var(--text-dim); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s;">
              ✏️ Edit
            </button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <nav class="dock-wrap">
    <div class="dock">
      <div class="dock-btn active">📊</div>
      <div class="dock-btn">🔍</div>
      <div class="dock-btn">📦</div>
      <div class="dock-btn">📄</div>
    </div>
  </nav>
</div>

</body>
</html>
