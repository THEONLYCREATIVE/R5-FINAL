<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Retail KPI Tracker — by Vysakh</title>
<meta name="description" content="Daily sales entry & KPI calculator for retail staff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KPI Tracker">
<meta name="theme-color" content="#0F172A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F172A;--bg2:#1E293B;--bg3:#334155;
  --surf:#1E293B;--surf2:#273548;--surf3:#334155;
  --glass:rgba(30,41,59,.85);
  --border:rgba(148,163,184,.1);--border2:rgba(148,163,184,.06);
  --t1:#F1F5F9;--t2:#CBD5E1;--t3:#94A3B8;--t4:#64748B;
  --teal:#14B8A6;--tealD:#0D9488;--tealL:rgba(20,184,166,.12);
  --blue:#3B82F6;--blueL:rgba(59,130,246,.12);
  --amber:#F59E0B;--amberL:rgba(245,158,11,.12);
  --pink:#EC4899;--pinkL:rgba(236,72,153,.12);
  --violet:#8B5CF6;--violetL:rgba(139,92,246,.12);
  --green:#22C55E;--greenL:rgba(34,197,94,.12);
  --orange:#F97316;--orangeL:rgba(249,115,22,.12);
  --red:#EF4444;--redL:rgba(239,68,68,.12);
  --cyan:#06B6D4;--cyanL:rgba(6,182,212,.12);
  --fd:'Outfit',sans-serif;--fm:'JetBrains Mono',monospace;
  --r:18px;--rl:24px;
  --sh:0 4px 24px rgba(0,0,0,.3),0 1px 4px rgba(0,0,0,.2);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overscroll-behavior:none}
body{height:100%;font-family:var(--fd);background:var(--bg);color:var(--t1);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
input,button,select,textarea{font-family:inherit;-webkit-appearance:none;border:none;outline:none;background:none;color:inherit}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* Tabs */
.tabs{display:flex;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 8px;flex-shrink:0;padding-top:env(safe-area-inset-top)}
.tab{flex:1;padding:14px 8px 12px;text-align:center;font-size:12px;font-weight:700;color:var(--t4);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .2s;letter-spacing:.02em}
.tab.on{color:var(--teal);border-color:var(--teal)}

/* Scroll */
.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom)}

/* Header */
.hdr{padding:20px 20px 8px;display:flex;justify-content:space-between;align-items:flex-start}
.hdr-date{font-size:12px;font-weight:600;color:var(--t4)}
.hdr-title{font-size:26px;font-weight:900;color:var(--t1);line-height:1.1;margin-top:2px;letter-spacing:-.02em}
.hdr-title span{color:var(--teal)}
.badge{display:flex;align-items:center;gap:4px;background:var(--surf);border:1px solid var(--border);border-radius:10px;padding:5px 10px;font-size:9px;font-weight:700;color:var(--t3)}

/* KPI Hero */
.kpi-hero{margin:12px 16px;background:linear-gradient(135deg,#0D4A42 0%,#0F766E 50%,#14B8A6 100%);border-radius:var(--rl);padding:20px;position:relative;overflow:hidden;box-shadow:0 8px 32px rgba(20,184,166,.2)}
.kpi-hero::before{content:'';position:absolute;top:-60px;right:-40px;width:180px;height:180px;background:rgba(255,255,255,.04);border-radius:50%}
.kpi-hero::after{content:'';position:absolute;bottom:-80px;left:-30px;width:200px;height:200px;background:rgba(255,255,255,.03);border-radius:50%}
.kpi-hero-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;opacity:.5;position:relative;z-index:1}
.kpi-hero-val{font-family:var(--fm);font-size:36px;font-weight:700;line-height:1;margin-top:4px;position:relative;z-index:1}
.kpi-hero-sub{font-size:13px;opacity:.7;margin-top:4px;position:relative;z-index:1}
.kpi-hero-row{display:flex;gap:8px;margin-top:14px;position:relative;z-index:1}
.kpi-hero-chip{flex:1;background:rgba(255,255,255,.1);backdrop-filter:blur(8px);border-radius:14px;padding:10px;text-align:center}
.kpi-hero-chip-val{font-family:var(--fm);font-size:18px;font-weight:700}
.kpi-hero-chip-lbl{font-size:9px;font-weight:700;opacity:.6;margin-top:2px;text-transform:uppercase;letter-spacing:.06em}

/* Entry Grid */
.entry-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px;margin-bottom:16px}
.entry-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:all .15s;position:relative;overflow:hidden}
.entry-card:active{transform:scale(.97);background:var(--surf2)}
.entry-card.full{grid-column:1/-1}
.ec-icon{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:10px}
.ec-label{font-size:11px;font-weight:700;color:var(--t3);margin-bottom:4px}
.ec-val{font-family:var(--fm);font-size:22px;font-weight:700;color:var(--t1);line-height:1}
.ec-empty{font-size:13px;color:var(--t4)}
.ec-kd{font-size:11px;color:var(--t4);margin-top:3px;font-weight:500}
.ec-suffix{font-size:11px;font-weight:500;color:var(--t4);margin-left:3px}

/* KPI Cards */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 16px;margin-bottom:16px}
.kpi-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kc-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.kc-val{font-family:var(--fm);font-size:24px;font-weight:700;line-height:1}
.kc-sub{font-size:10px;color:var(--t4);margin-top:4px}
.kc-formula{font-family:var(--fm);font-size:8px;color:var(--t4);margin-top:2px;opacity:.7}

/* Checklist */
.cl-item{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin:0 16px 8px;cursor:pointer;transition:all .2s}
.cl-item:active{transform:scale(.98)}
.cl-item.done{background:rgba(34,197,94,.08);border-color:rgba(34,197,94,.2)}
.cl-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;transition:all .25s}
.cl-icon.done{color:#fff}
.cl-text{font-size:13px;font-weight:600;color:var(--t2);line-height:1.3;flex:1;transition:color .2s}
.cl-item.done .cl-text{color:var(--green);text-decoration:line-through;text-decoration-color:rgba(34,197,94,.3)}
.cl-check{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--bg3);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;flex-shrink:0;transition:all .25s}
.cl-item.done .cl-check{background:var(--green);border-color:var(--green)}

/* Section Header */
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin:20px 0 10px}
.sec-t{font-size:12px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:6px}
.sec-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sec-badge{font-size:10px;font-weight:800;padding:3px 10px;border-radius:10px}

/* Modal */
.modal-bg{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:flex-end;justify-content:center}
.modal-card{background:var(--bg2);border-radius:28px 28px 0 0;padding:12px 24px max(32px, env(safe-area-inset-bottom));width:100%;max-width:420;box-shadow:0 -10px 40px rgba(0,0,0,.4);animation:slideUp .3s cubic-bezier(.4,0,.2,1)}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--bg3);margin:0 auto 24px}
.modal-icon{width:60px;height:60px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:30px;margin-bottom:14px}
.modal-title{font-size:22px;font-weight:800;margin-bottom:2px}
.modal-sub{font-size:12px;color:var(--t4);margin-bottom:20px}
.modal-input-wrap{background:var(--bg);border:2px solid var(--bg3);border-radius:18px;padding:14px 20px;display:flex;align-items:center;gap:10px;transition:border-color .2s}
.modal-input-wrap:focus-within{border-color:var(--teal)}
.modal-input{flex:1;font-family:var(--fm);font-size:32px;font-weight:700;color:var(--t1)}
.modal-input::placeholder{color:var(--t4)}
.modal-suffix{font-size:14px;font-weight:800}
.modal-kd{margin-top:10px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:12px}
.modal-btns{display:flex;gap:10px;margin-top:24px}
.modal-cancel{flex:1;height:52px;border-radius:16px;background:var(--bg);color:var(--t3);font-size:15px;font-weight:700;cursor:pointer}
.modal-save{flex:1;height:52px;border-radius:16px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.3)}

/* Custom task form */
.add-form{padding:10px 16px;display:flex;gap:8px}
.add-input{flex:1;height:42px;background:var(--bg);border:1.5px solid var(--bg3);border-radius:12px;padding:0 14px;font-size:13px;color:var(--t1);transition:border-color .2s}
.add-input:focus{border-color:var(--teal)}
.add-btn{height:42px;padding:0 18px;background:var(--teal);color:#fff;border-radius:12px;font-size:13px;font-weight:800;cursor:pointer}

/* History */
.hist-card{background:var(--surf);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;margin:6px 16px;cursor:pointer;transition:transform .15s}
.hist-card:active{transform:scale(.98)}

/* Buttons */
.btn-primary{width:calc(100% - 32px);height:56px;background:linear-gradient(135deg,var(--tealD),var(--teal));color:#fff;border-radius:var(--r);font-size:16px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin:0 16px 12px;box-shadow:0 6px 24px rgba(20,184,166,.25);transition:transform .15s}
.btn-primary:active{transform:scale(.97)}
.btn-outline{width:calc(100% - 32px);height:46px;background:transparent;color:var(--red);border:1.5px solid var(--red);border-radius:14px;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;margin:0 16px 8px}

/* Toast */
.toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(10px);background:var(--t1);color:var(--bg);padding:10px 22px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:all .25s;z-index:600;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes confettiFall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

@media(max-width:360px){.entry-grid{grid-template-columns:1fr}.kpi-hero-val{font-size:28px}}
</style>
</head>
<body>
<div id="app">
  <!-- TABS -->
  <div class="tabs">
    <div class="tab on" id="tab-entry" onclick="goTab('entry')">📊 Entry</div>
    <div class="tab" id="tab-kpis" onclick="goTab('kpis')">📈 KPIs</div>
    <div class="tab" id="tab-close" onclick="goTab('close')">✅ Close</div>
    <div class="tab" id="tab-hist" onclick="goTab('hist')">📂 History</div>
  </div>

  <div class="main" id="main-scroll">
    <!-- ═══ ENTRY TAB ═══ -->
    <div id="view-entry">
      <div class="hdr">
        <div>
          <div class="hdr-date" id="hdr-date"></div>
          <div class="hdr-title">Retail <span>KPI</span></div>
        </div>
        <div class="badge">💊 <span style="color:var(--teal)">by Vysakh</span></div>
      </div>

      <!-- Hero -->
      <div class="kpi-hero">
        <div class="kpi-hero-label">Today's Sales</div>
        <div class="kpi-hero-val" id="hero-val">—</div>
        <div class="kpi-hero-sub" id="hero-sub">Enter sales below</div>
        <div class="kpi-hero-row">
          <div class="kpi-hero-chip"><div class="kpi-hero-chip-val" id="hero-atv">—</div><div class="kpi-hero-chip-lbl">ATV</div></div>
          <div class="kpi-hero-chip"><div class="kpi-hero-chip-val" id="hero-ipc">—</div><div class="kpi-hero-chip-lbl">IPC</div></div>
          <div class="kpi-hero-chip"><div class="kpi-hero-chip-val" id="hero-conv">—</div><div class="kpi-hero-chip-lbl">Conv%</div></div>
          <div class="kpi-hero-chip"><div class="kpi-hero-chip-val" id="hero-no7">—</div><div class="kpi-hero-chip-lbl">No7%</div></div>
        </div>
      </div>

      <!-- Entry Grid -->
      <div class="sec-h"><div class="sec-t"><div class="sec-dot" style="background:var(--teal)"></div>DATA ENTRY</div></div>
      <div class="entry-grid" id="entry-grid"></div>
      <div style="padding:0 16px 16px"><button class="btn-primary" onclick="saveEntry()">✓ Save Today's Entry</button></div>
    </div>

    <!-- ═══ KPI TAB ═══ -->
    <div id="view-kpis" style="display:none">
      <div class="hdr"><div><div class="hdr-date" id="kpi-date"></div><div class="hdr-title">Your <span>KPIs</span></div></div></div>
      <div class="kpi-grid" id="kpi-grid"></div>
    </div>

    <!-- ═══ CLOSING TAB ═══ -->
    <div id="view-close" style="display:none">
      <div class="hdr"><div><div class="hdr-title">Closing <span>Checklist</span></div></div></div>
      <div class="sec-h"><div class="sec-t"><div class="sec-dot" style="background:var(--red)"></div>REQUIRED TASKS</div><div class="sec-badge" id="cl-badge" style="background:var(--redL);color:var(--red)">0/0</div></div>
      <div id="cl-list"></div>
      <div class="sec-h" style="margin-top:16px"><div class="sec-t"><div class="sec-dot" style="background:var(--violet)"></div>CUSTOM TASKS</div></div>
      <div id="cl-custom"></div>
      <div class="add-form">
        <input class="add-input" id="custom-input" placeholder="Add custom task...">
        <button class="add-btn" onclick="addCustom()">+ Add</button>
      </div>
      <div style="padding:8px 16px 16px"><button class="btn-primary" onclick="saveEntry()">✓ Save Checklist</button></div>
    </div>

    <!-- ═══ HISTORY TAB ═══ -->
    <div id="view-hist" style="display:none">
      <div class="hdr"><div><div class="hdr-title">Sales <span>History</span></div></div></div>
      <div id="hist-list"></div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modal" style="display:none" onclick="closeModal()">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-icon" id="m-icon"></div>
    <div class="modal-title" id="m-title"></div>
    <div class="modal-sub" id="m-sub"></div>
    <div class="modal-input-wrap">
      <input class="modal-input" id="m-input" type="number" inputmode="decimal" placeholder="0" onkeydown="if(event.key==='Enter')saveModal()">
      <span class="modal-suffix" id="m-suffix"></span>
    </div>
    <div id="m-kd" style="display:none" class="modal-kd"></div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-save" id="m-save" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<!-- Confetti -->
<div id="confetti" style="position:fixed;inset:0;z-index:1000;pointer-events:none;display:none"></div>

<div class="toast" id="toast"></div>

<script>
/* ═══ DATA ═══ */
const AED2KD=11.9;
const FIELDS=[
  {key:"totalAED",label:"Total Sales",icon:"💰",color:"var(--teal)",bg:"var(--tealL)",suffix:"AED",showKD:true},
  {key:"trn",label:"Transactions",icon:"🧾",color:"var(--blue)",bg:"var(--blueL)",suffix:"TRN"},
  {key:"footfall",label:"Footfall (SFA)",icon:"👣",color:"var(--violet)",bg:"var(--violetL)",suffix:"ppl"},
  {key:"no7AED",label:"No7 Sales",icon:"💎",color:"var(--pink)",bg:"var(--pinkL)",suffix:"AED",showKD:true},
  {key:"no7Focus",label:"No7 Focus Items",icon:"🎯",color:"var(--red)",bg:"var(--redL)",suffix:"pcs"},
  {key:"totalProducts",label:"Total Units Sold",icon:"📦",color:"var(--orange)",bg:"var(--orangeL)",suffix:"items"},
  {key:"aura",label:"Aura Signups",icon:"✨",color:"var(--amber)",bg:"var(--amberL)",suffix:"links"},
  {key:"dssr",label:"DSSR Cash",icon:"🏦",color:"var(--cyan)",bg:"var(--cyanL)",suffix:"AED",showKD:true,full:true},
];

const DEFAULT_CHECKS=[
  {id:"c1",label:"Cash safe handover completed?",icon:"🔐",color:"var(--red)"},
  {id:"c2",label:"Store sales tracker updated and finished?",icon:"📊",color:"var(--blue)"},
  {id:"c3",label:"All lights switched off?",icon:"💡",color:"var(--amber)"},
  {id:"c4",label:"SOP for bag and personal belongings check completed?",icon:"👜",color:"var(--violet)"},
  {id:"c5",label:"Daily sales posted in the group?",icon:"📱",color:"var(--green)"},
  {id:"c6",label:"Music system turned off?",icon:"🔇",color:"var(--pink)"},
  {id:"c7",label:"ARES daily sales closed and systems shut down properly?",icon:"🖥️",color:"var(--teal)"},
];

let SF={}, CK={}, CUSTOM=[], HIST=[];
const todayKey=()=>new Date().toISOString().split('T')[0];
const n2=v=>{const n=parseFloat(v);return isNaN(n)||v===''?null:n};
let curModal=null;

/* ═══ STORAGE ═══ */
function save(){
  try{
    localStorage.setItem('rkpi_entry_'+todayKey(),JSON.stringify(SF));
    localStorage.setItem('rkpi_checks_'+todayKey(),JSON.stringify(CK));
    localStorage.setItem('rkpi_custom',JSON.stringify(CUSTOM));
    localStorage.setItem('rkpi_hist',JSON.stringify(HIST));
  }catch(e){}
}
function load(){
  try{
    const e=localStorage.getItem('rkpi_entry_'+todayKey()); if(e)SF=JSON.parse(e);
    const c=localStorage.getItem('rkpi_checks_'+todayKey()); if(c)CK=JSON.parse(c);
    const cu=localStorage.getItem('rkpi_custom'); if(cu)CUSTOM=JSON.parse(cu);
    const h=localStorage.getItem('rkpi_hist'); if(h)HIST=JSON.parse(h);
  }catch(e){}
}

/* ═══ TABS ═══ */
let curTab='entry';
function goTab(t){
  ['entry','kpis','close','hist'].forEach(id=>{
    document.getElementById('view-'+id).style.display=id===t?'block':'none';
    document.getElementById('tab-'+id).className='tab'+(id===t?' on':'');
  });
  curTab=t;
  document.getElementById('main-scroll').scrollTop=0;
  if(t==='kpis')renderKPIs();
  if(t==='close')renderChecklist();
  if(t==='hist')renderHistory();
}

/* ═══ ENTRY GRID ═══ */
function renderEntryGrid(){
  const g=document.getElementById('entry-grid');
  g.innerHTML=FIELDS.map(f=>{
    const v=SF[f.key], has=v!==undefined&&v!==''&&v!==null;
    const kd=has&&f.showKD?(parseFloat(v)/AED2KD).toFixed(2):null;
    return`<div class="entry-card${f.full?' full':''}" onclick="openModal('${f.key}')" style="animation:fadeIn .3s ease both">
      <div class="ec-icon" style="background:${f.bg}">${f.icon}</div>
      <div class="ec-label">${f.label}</div>
      ${has?`<div class="ec-val">${parseFloat(v).toLocaleString()}<span class="ec-suffix">${f.suffix}</span></div>`:`<div class="ec-empty">Tap to enter</div>`}
      ${kd?`<div class="ec-kd">${kd} KD</div>`:''}
    </div>`;
  }).join('');
}

/* ═══ HERO ═══ */
function renderHero(){
  const tAED=n2(SF.totalAED),trn=n2(SF.trn),foot=n2(SF.footfall),n7=n2(SF.no7AED),tProd=n2(SF.totalProducts);
  const tKD=tAED!=null?tAED/AED2KD:null;
  // ATV stays AED
  const atv=tAED!=null&&trn?(tAED/trn).toFixed(2):null;
  const ipc=tProd!=null&&trn?(tProd/trn).toFixed(2):null;
  const conv=trn!=null&&foot?((trn/foot)*100).toFixed(1):null;
  const n7p=n7!=null&&tAED?((n7/tAED)*100).toFixed(1):null;

  document.getElementById('hero-val').innerHTML=tAED!=null?`${tAED.toLocaleString()} <span style="font-size:16px;font-weight:400;opacity:.6">AED</span>`:'—';
  document.getElementById('hero-sub').textContent=tKD!=null?`${tKD.toFixed(2)} KD`:'Enter sales below';
  document.getElementById('hero-atv').textContent=atv??'—';
  document.getElementById('hero-ipc').textContent=ipc??'—';
  document.getElementById('hero-conv').textContent=conv?conv+'%':'—';
  document.getElementById('hero-no7').textContent=n7p?n7p+'%':'—';
}

/* ═══ KPI CARDS ═══ */
function renderKPIs(){
  const tAED=n2(SF.totalAED),trn=n2(SF.trn),foot=n2(SF.footfall),n7=n2(SF.no7AED),tProd=n2(SF.totalProducts),aura=n2(SF.aura);
  const tKD=tAED!=null?tAED/AED2KD:null;
  const atv=tAED!=null&&trn?(tAED/trn).toFixed(2):null;
  const ipc=tProd!=null&&trn?(tProd/trn).toFixed(2):null;
  const conv=trn!=null&&foot?((trn/foot)*100).toFixed(1):null;
  const n7p=n7!=null&&tAED?((n7/tAED)*100).toFixed(1):null;
  const auraPct=aura!=null&&trn?((aura/trn)*100).toFixed(1):null;

  document.getElementById('kpi-date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
  const kpis=[
    {l:'ATV',v:atv,s:'AED',c:'var(--amber)',bg:'var(--amberL)',sub:'Total Sales ÷ Transactions',note:atv&&tKD&&trn?`${(tKD/trn).toFixed(2)} KD`:null},
    {l:'IPC',v:ipc,s:'',c:'var(--blue)',bg:'var(--blueL)',sub:'Total Units ÷ Transactions'},
    {l:'Conversion',v:conv,s:'%',c:'var(--green)',bg:'var(--greenL)',sub:'Transactions ÷ Footfall × 100'},
    {l:'No7 Share',v:n7p,s:'%',c:'var(--violet)',bg:'var(--violetL)',sub:'No7 Sales ÷ Total Sales × 100'},
    {l:'AURA',v:auraPct,s:'%',c:'var(--amber)',bg:'var(--amberL)',sub:'Signups ÷ Transactions × 100'},
    {l:'Total KD',v:tKD!=null?tKD.toFixed(2):null,s:'KD',c:'var(--teal)',bg:'var(--tealL)',sub:`AED ${tAED?.toLocaleString()||'—'} ÷ 11.9`},
  ];
  document.getElementById('kpi-grid').innerHTML=kpis.map(k=>`
    <div class="kpi-card" style="animation:fadeIn .3s ease both">
      <div style="position:absolute;top:0;left:0;right:0;height:3px;background:${k.c};border-radius:3px 3px 0 0"></div>
      <div class="kc-label" style="color:${k.c}">${k.l}</div>
      <div class="kc-val" style="color:${k.v!=null?'var(--t1)':'var(--t4)'}">${k.v!=null?k.v+k.s:'—'}</div>
      ${k.note?`<div class="kc-sub" style="color:var(--t3)">${k.note}</div>`:''}
      <div class="kc-formula">${k.sub}</div>
    </div>`).join('');
}

/* ═══ CHECKLIST ═══ */
function renderChecklist(){
  const all=[...DEFAULT_CHECKS,...CUSTOM.map((c,i)=>({id:'cu'+i,label:c,icon:'📌',color:'var(--t3)',custom:true,idx:i}))];
  const done=all.filter(c=>CK[c.id]).length;
  const badge=document.getElementById('cl-badge');
  badge.textContent=`${done}/${all.length}`;
  badge.style.background=done===all.length?'var(--greenL)':'var(--redL)';
  badge.style.color=done===all.length?'var(--green)':'var(--red)';

  document.getElementById('cl-list').innerHTML=DEFAULT_CHECKS.map(c=>{
    const d=CK[c.id];
    return`<div class="cl-item${d?' done':''}" onclick="toggleCheck('${c.id}')">
      <div class="cl-icon${d?' done':''}" style="background:${d?c.color:c.color+'18'};color:${d?'#fff':c.color}">${d?'✓':c.icon}</div>
      <div class="cl-text">${c.label}</div>
      <div class="cl-check">${d?'✓':''}</div>
    </div>`;
  }).join('');

  document.getElementById('cl-custom').innerHTML=CUSTOM.map((c,i)=>{
    const id='cu'+i, d=CK[id];
    return`<div class="cl-item${d?' done':''}" onclick="toggleCheck('${id}')">
      <div class="cl-icon${d?' done':''}" style="background:${d?'var(--violet)':'var(--violetL)'};color:${d?'#fff':'var(--violet)'};">${d?'✓':'📌'}</div>
      <div class="cl-text">${c}</div>
      <button onclick="event.stopPropagation();removeCustom(${i})" style="background:none;border:none;color:var(--t4);font-size:16px;cursor:pointer;padding:4px">×</button>
      <div class="cl-check">${d?'✓':''}</div>
    </div>`;
  }).join('');
}

function toggleCheck(id){CK[id]=!CK[id];save();renderChecklist();
  const all=[...DEFAULT_CHECKS,...CUSTOM.map((_,i)=>({id:'cu'+i}))];
  if(all.every(c=>CK[c.id]))showConfetti();
}

function addCustom(){
  const inp=document.getElementById('custom-input'),v=inp.value.trim();
  if(!v)return;CUSTOM.push(v);inp.value='';save();renderChecklist();toast('✅ Added');
}
function removeCustom(i){CUSTOM.splice(i,1);save();renderChecklist();toast('Removed');}

/* ═══ MODAL ═══ */
function openModal(key){
  const f=FIELDS.find(x=>x.key===key);if(!f)return;curModal=f;
  document.getElementById('m-icon').style.background=f.bg;document.getElementById('m-icon').innerHTML=`<span style="font-size:30px">${f.icon}</span>`;
  document.getElementById('m-title').textContent=f.label;
  document.getElementById('m-sub').textContent='Enter value in '+f.suffix;
  document.getElementById('m-suffix').textContent=f.suffix;document.getElementById('m-suffix').style.color=f.color;
  document.getElementById('m-save').style.background=f.color;
  const inp=document.getElementById('m-input');inp.value=SF[f.key]||'';
  document.getElementById('modal').style.display='flex';
  setTimeout(()=>inp.focus(),100);
  updateModalKD();
  inp.oninput=updateModalKD;
}
function updateModalKD(){
  const el=document.getElementById('m-kd'),v=n2(document.getElementById('m-input').value);
  if(curModal?.showKD&&v!=null){el.style.display='inline-flex';el.style.background=curModal.bg;el.style.color=curModal.color;el.innerHTML=`<span style="font-family:var(--fm);font-weight:700">${(v/AED2KD).toFixed(2)}</span><span style="font-weight:400;font-size:12px;color:var(--t4)">KD</span>`}
  else{el.style.display='none'}
}
function closeModal(){document.getElementById('modal').style.display='none';curModal=null}
function saveModal(){if(!curModal)return;SF[curModal.key]=document.getElementById('m-input').value;closeModal();save();renderEntryGrid();renderHero();toast('✅ Saved')}

/* ═══ HISTORY ═══ */
function renderHistory(){
  const c=document.getElementById('hist-list');
  if(!HIST.length){c.innerHTML='<div style="text-align:center;padding:60px 20px;color:var(--t4)"><div style="font-size:48px;margin-bottom:8px">📊</div><div style="font-size:16px;font-weight:700;color:var(--t2)">No entries yet</div></div>';return}
  c.innerHTML=HIST.map(h=>{
    const t=n2(h.totalAED);
    return`<div class="hist-card"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:14px;font-weight:800;color:var(--t1)">${h.date}</span><span style="font-size:10px;font-weight:800;color:var(--green);background:var(--greenL);padding:2px 8px;border-radius:8px">✓</span></div><div style="display:flex;gap:12px;font-size:11px;color:var(--t3);flex-wrap:wrap">${h.totalAED?`<span>💰 ${parseFloat(h.totalAED).toLocaleString()} AED</span>`:''}${h.trn?`<span>🧾 ${h.trn} TRN</span>`:''}${h.no7AED?`<span>💎 ${parseFloat(h.no7AED).toLocaleString()} No7</span>`:''}${h.dssr?`<span>🏦 ${parseFloat(h.dssr).toLocaleString()} DSSR</span>`:''}</div></div>`;
  }).join('');
}

/* ═══ SAVE ENTRY ═══ */
function saveEntry(){
  const entry={...SF,checks:{...CK},date:todayKey(),at:new Date().toISOString()};
  HIST=[entry,...HIST.filter(h=>h.date!==todayKey())];
  save();toast('✅ Saved!');
  const all=[...DEFAULT_CHECKS,...CUSTOM.map((_,i)=>({id:'cu'+i}))];
  if(all.every(c=>CK[c.id])&&n2(SF.totalAED)!=null)showConfetti();
}

/* ═══ CONFETTI ═══ */
function showConfetti(){
  const el=document.getElementById('confetti');el.style.display='block';
  const colors=['#14B8A6','#F59E0B','#3B82F6','#EC4899','#8B5CF6','#22C55E','#F97316'];
  el.innerHTML=Array.from({length:40}).map(()=>{
    const c=colors[Math.floor(Math.random()*colors.length)];
    return`<div style="position:absolute;left:${Math.random()*100}%;top:-10px;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;border-radius:${Math.random()>.5?'50%':'2px'};background:${c};animation:confettiFall ${1.2+Math.random()*1.5}s ease-out forwards;animation-delay:${Math.random()*.4}s"></div>`;
  }).join('');
  setTimeout(()=>{el.style.display='none';el.innerHTML=''},3000);
}

/* ═══ TOAST ═══ */
let toastT;function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600)}

/* ═══ HEADER ═══ */
function renderHeader(){document.getElementById('hdr-date').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short',year:'numeric'})}

/* ═══ INIT ═══ */
load();renderHeader();renderEntryGrid();renderHero();

/* ═══ SW ═══ */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
